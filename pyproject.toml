[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudkeeper-preflight"
version = "1.8.0"
description = "CloudKeeper PreFlight - AWS Organization Dependency Assessor"
requires-python = ">=3.8"
dependencies = ["boto3>=1.26.0"]

[project.scripts]
cloudkeeper-preflight = "cloudkeeper_preflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
